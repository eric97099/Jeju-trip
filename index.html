<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<style>
:root{
  color-scheme:light;
  --page:#f7f5ef;--ink:#172019;--ink2:#6f746d;--ink3:#9a9d97;
  --card:rgba(255,255,255,.76);--card-strong:rgba(255,255,255,.96);--surface:#fff;
  --hairline:rgba(0,0,0,.08);--hairline-soft:rgba(0,0,0,.06);
  --sea:#e8f2f2;--land1:#e7ebdd;--land2:#eee7da;
  --brand:#2f4a3e;--brand-hover:#3a5c4c;
  --d1:#3d8fc4;--d2:#e56f61;--d3:#3f9a7a;--d4:#d99232;--d5:#756bc1;
}

*{box-sizing:border-box}
html{color-scheme:light only;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.page{max-width:2400px;margin:0 auto;padding:0 22px 20px;padding-top:env(safe-area-inset-top,0px);padding-bottom:max(20px,env(safe-area-inset-bottom));padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;padding:0 22px;margin:18px 0 16px;background:var(--card);border:1px solid var(--hairline-soft);border-radius:20px;box-shadow:0 8px 30px rgba(40,50,40,.06)}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.menu-toggle{flex-shrink:0;width:46px;height:46px;border-radius:14px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.titletext{min-width:0}
.topbar h1{margin:0;font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.2px;text-wrap:balance}
.topbar .sub{color:var(--ink3);font-size:13px;margin-top:3px}
.copy-all{flex-shrink:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:650;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .18s ease}
.copy-all:hover{background:var(--brand-hover)}
.copy-all .icon{font-size:16px}

.body{display:flex;gap:18px;align-items:flex-start}
.sidebar{flex-shrink:0;width:312px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--hairline-soft);border-radius:20px;padding:14px;box-shadow:0 8px 30px rgba(40,50,40,.06);max-height:calc(100dvh - 170px);min-height:600px}
.sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:2px 6px 12px;border-bottom:1px solid var(--hairline-soft);margin-bottom:6px}
.sidebar-head h2{margin:0;font-size:16px;font-weight:750;color:var(--ink)}
.sidebar-head .sub{color:var(--ink3);font-size:12px;margin-top:3px}
.sidebar-close{display:none;flex-shrink:0;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:var(--ink3);font-size:21px;cursor:pointer;touch-action:manipulation;align-items:center;justify-content:center}
.sidebar-list{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding-right:2px}

.day-group{border:0;margin:8px 0}
.day-group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:10px;-webkit-tap-highlight-color:transparent}
.day-group summary::-webkit-details-marker{display:none}
.day-group.active summary{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.day-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.day-title{font-weight:750;font-size:14px;color:var(--ink)}
.day-date{font-size:12.5px;color:var(--ink3);font-weight:500}
.chevron{margin-left:auto;font-size:13px;color:var(--ink3);transition:transform .18s ease;flex-shrink:0}
.day-group[open] .chevron{transform:rotate(90deg)}
.day-items{display:flex;flex-direction:column;gap:2px;padding:2px 2px 6px}
.item{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:center;min-height:56px;padding:8px 10px;border:0;border-radius:12px;background:transparent;color:var(--ink);text-align:left;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.item:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.item.selected{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.item-num{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:750;font-variant-numeric:tabular-nums}
.item-name{display:block;font-size:14px;font-weight:650}
.item-meta{display:block;font-size:12px;color:var(--ink3);margin-top:1px}

.content{flex:1;min-width:0}
.filters{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:4px;padding-bottom:4px;margin-bottom:14px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex-shrink:0;scroll-snap-align:start;display:flex;align-items:center;gap:7px;height:41px;padding:0 16px;border-radius:999px;border:1px solid var(--hairline);background:var(--card);color:var(--ink2);font-size:13.5px;font-weight:650;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background .15s ease,color .15s ease,border-color .15s ease}
.filters button .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.filters button[data-id="all"].active{background:var(--brand);border-color:var(--brand);color:#fff}

.mapbox{position:relative;background:var(--sea);border-radius:21px;overflow:hidden;box-shadow:0 12px 35px rgba(40,50,40,.06);height:clamp(600px,calc(100dvh - 170px),820px)}
.mapbox svg{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
.viewport.animate{transition:transform .25s ease}
.map-reset{position:absolute;z-index:7;top:14px;right:14px;width:40px;height:40px;border:1px solid var(--hairline);border-radius:50%;background:var(--card-strong);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.map-reset[hidden]{display:none}
.district{stroke:var(--hairline);stroke-width:1}
.jeju{fill:var(--land1)}
.seogwipo{fill:var(--land2)}
.gridline{fill:none;stroke:var(--ink3);stroke-width:.6;opacity:.25}
.route{fill:none;stroke-width:1.8;stroke-dasharray:6 4;opacity:.55}
.route-arrow{pointer-events:none}
.leader{stroke:rgba(80,90,80,.35);stroke-width:1}
.marker{cursor:pointer;-webkit-tap-highlight-color:transparent}
.marker .hit{fill:transparent;stroke:none}
.marker .ring{fill:none;stroke:#fff;stroke-width:2;opacity:.9;pointer-events:none}
.marker .dot{stroke:#fff;stroke-width:2;filter:drop-shadow(0 2px 6px rgba(0,0,0,.14))}
.marker.selected .dot{stroke-width:2.5;filter:drop-shadow(0 4px 12px rgba(0,0,0,.2))}
.marker.context{pointer-events:none}
.marker text{fill:#fff;font-size:11.5px;font-weight:750;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.region-label{fill:rgba(60,75,65,.72);font-size:13px;font-weight:650;text-anchor:middle;pointer-events:none}
.region-label.peak{font-size:12px}

.footer{margin:16px 4px 0;color:var(--ink3);font-size:12px}

.backdrop{display:none}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:30;white-space:nowrap}
.toast.show{opacity:1}

.place-popup{position:absolute;z-index:8;left:14px;right:14px;bottom:14px;display:flex;align-items:stretch;gap:18px;padding:18px 20px;border-radius:18px;background:var(--card-strong);box-shadow:0 10px 30px rgba(0,0,0,.12);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .18s,transform .18s,visibility .18s}
.place-popup.show{opacity:1;visibility:visible;transform:translateY(0)}
.popup-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink3);font-size:20px;cursor:pointer;touch-action:manipulation}
.popup-info{flex:1;min-width:0;padding-right:28px}
.popup-day{font-size:11.5px;font-weight:750;margin-bottom:3px}
.popup-name{margin:0;font-size:21px;font-weight:750;color:var(--ink)}
.popup-kr{margin:4px 0 8px;font-size:14.5px;color:var(--ink2)}
.popup-hours{margin:0 0 6px;font-size:13px;color:var(--ink);font-weight:650}
.popup-hours[hidden]{display:none}
.popup-address{margin:0;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);user-select:text}
.popup-ferry{display:block;margin-top:8px;font-size:12.5px;color:var(--brand);text-decoration:underline}
.popup-ferry[hidden]{display:none}
.popup-address-text{overflow-wrap:anywhere}
.popup-address-copy{flex-shrink:0;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--ink3);font-size:13px;cursor:pointer;touch-action:manipulation}
.popup-address-copy:hover{color:var(--ink)}
.popup-actions{flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:8px;width:160px}
.popup-copy{height:45px;border:1px solid var(--hairline);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:650;cursor:pointer;touch-action:manipulation}
.popup-nav{height:45px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--brand);color:#fff;font-weight:650;text-decoration:none;touch-action:manipulation;transition:background .15s ease}
.popup-nav:hover{background:var(--brand-hover)}

@media(min-width:1024px){
  .sidebar{position:static}
}
@media(max-width:1023.98px){
  .body{display:block}
  .sidebar{position:fixed;z-index:21;top:0;bottom:0;left:0;width:min(86vw,320px);max-width:none;max-height:none;min-height:0;border-radius:0;box-shadow:6px 0 24px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .22s ease;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
  body.drawer-open .sidebar{transform:translateX(0)}
  .sidebar-close{display:flex}
  body.drawer-open{overflow:hidden}
  .backdrop{display:block;position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;pointer-events:none}
  body.drawer-open .backdrop{opacity:1;visibility:visible;pointer-events:auto}
}
@media(max-width:767.98px){
  .page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .topbar{min-height:70px;padding:0 14px;margin:14px 0 12px}
  .menu-toggle{width:42px;height:42px;font-size:18px;border-radius:12px}
  .topbar h1{font-size:20px}
  .topbar .sub{font-size:12px}
  .copy-all{width:42px;height:42px;padding:0;justify-content:center}
  .copy-all .label{display:none}
  .mapbox{height:clamp(500px,65dvh,680px);border-radius:17px}
  .place-popup{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column;max-height:45vh;overflow-y:auto;padding:16px 16px 14px;gap:10px}
  .popup-info{padding-right:0}
  .popup-name{font-size:19px}
  .popup-actions{flex-direction:row;width:auto}
  .popup-copy,.popup-nav{flex:1}
}
@media(max-width:360px){
  .popup-actions{flex-direction:column}
}
</style>
</head>

let panScale=1,panX=0,panY=0,mapW=0,mapH=0,currentViewport=null,mapDragMoved=false;
const MIN_SCALE=1,MAX_SCALE=4;
function applyTransform(){
  if(currentViewport)currentViewport.setAttribute('transform',`translate(${panX},${panY}) scale(${panScale})`);
  mapResetBtn.hidden=(Math.abs(panScale-1)<.001&&Math.abs(panX)<.5&&Math.abs(panY)<.5);
}
function clampPan(){
  const overpan=Math.min(80,mapW*.15,mapH*.15)||40;
  const minX=mapW-mapW*panScale-overpan,maxX=overpan;
  const minY=mapH-mapH*panScale-overpan,maxY=overpan;
  panX=Math.min(maxX,Math.max(minX,panX));
  panY=Math.min(maxY,Math.max(minY,panY));
}
function svgLocalPoint(e){const r=svg.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function ptDist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function ptMid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
const activePointers=new Map();
let pinchStartDist=null,pinchStartScale=1,pinchMid=null,dragStart=null;
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  svg.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId,svgLocalPoint(e));
  if(activePointers.size===1){dragStart=svgLocalPoint(e);mapDragMoved=false}
  if(activePointers.size===2){const [a,b]=[...activePointers.values()];pinchStartDist=ptDist(a,b);pinchStartScale=panScale;pinchMid=ptMid(a,b)}
});
svg.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId))return;
  const p=svgLocalPoint(e),prev=activePointers.get(e.pointerId);
  activePointers.set(e.pointerId,p);
  if(activePointers.size===1){
    const dx=p.x-prev.x,dy=p.y-prev.y;
    if(Math.hypot(p.x-dragStart.x,p.y-dragStart.y)>6)mapDragMoved=true;
    if(mapDragMoved){panX+=dx;panY+=dy;clampPan();applyTransform();e.preventDefault()}
  }else if(activePointers.size===2){
    mapDragMoved=true;
    const [a,b]=[...activePointers.values()];
    const newDist=ptDist(a,b),newMid=ptMid(a,b);
    const newScale=Math.min(MAX_SCALE,Math.max(MIN_SCALE,pinchStartScale*(newDist/pinchStartDist)));
    const contentX=(pinchMid.x-panX)/panScale,contentY=(pinchMid.y-panY)/panScale;
    panScale=newScale;panX=newMid.x-panScale*contentX;panY=newMid.y-panScale*contentY;
    clampPan();applyTransform();e.preventDefault();
  }
});
function endPointer(e){activePointers.delete(e.pointerId);if(activePointers.size<2)pinchStartDist=null}
svg.addEventListener('pointerup',endPointer);
svg.addEventListener('pointercancel',endPointer);
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const p=svgLocalPoint(e),factor=Math.exp(-e.deltaY*.0015);
  const newScale=Math.min(MAX_SCALE,Math.max(MIN_SCALE,panScale*factor));
  const contentX=(p.x-panX)/panScale,contentY=(p.y-panY)/panScale;
  panScale=newScale;panX=p.x-panScale*contentX;panY=p.y-panScale*contentY;
  clampPan();applyTransform();
},{passive:false});
mapResetBtn.addEventListener('click',()=>{
  currentViewport&&currentViewport.classList.add('animate');
  panScale=1;panX=0;panY=0;applyTransform();
  setTimeout(()=>{currentViewport&&currentViewport.classList.remove('animate')},260);
});

function visible(){return filter==='all'?all:days.find(d=>d.id===filter).places}

async function copyText(text){
  let copied=false;
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);copied=true}catch(e){}}
  if(!copied){
    const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.top='0';t.style.left='0';t.style.opacity='0';t.style.fontSize='16px';
    document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,t.value.length);
    try{copied=document.execCommand('copy')}catch(e){}
    t.remove();
  }
  toast.textContent=copied?'已複製':'無法自動複製，請長按地址複製';
  toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600);
}
const inertTargets=()=>[document.querySelector('.topbar'),document.querySelector('.content'),document.querySelector('.footer')];
function openDrawer(){
  if(!window.matchMedia('(max-width:1023.98px)').matches)return;
  if(document.body.classList.contains('drawer-open'))return;
  lastFocused=document.activeElement;
  document.body.classList.add('drawer-open');sidebar.setAttribute('aria-hidden','false');menuToggle.setAttribute('aria-expanded','true');
  inertTargets().forEach(el=>{if(el)el.inert=true});
  const closeBtn=document.querySelector('.sidebar-close');if(closeBtn){void closeBtn.offsetHeight;closeBtn.focus()}
}
function closeDrawer(skipFocusRestore){
  if(!document.body.classList.contains('drawer-open'))return;
  const shouldRestoreFocus=!skipFocusRestore&&sidebar.contains(document.activeElement);
  document.body.classList.remove('drawer-open');sidebar.setAttribute('aria-hidden','true');menuToggle.setAttribute('aria-expanded','false');
  inertTargets().forEach(el=>{if(el)el.inert=false});
  if(shouldRestoreFocus&&lastFocused&&typeof lastFocused.focus==='function')lastFocused.focus();
  lastFocused=null;
}
function hidePopup(clearSelection){
  const wasShown=popup.classList.contains('show');
  popup.classList.remove('show');popup.setAttribute('aria-hidden','true');
  if(wasShown&&popup.contains(document.activeElement)){
    const target=document.querySelector('.filters button.active')||menuToggle;
    if(target&&typeof target.focus==='function')target.focus();
  }
  if(clearSelection){selected=null;renderList();draw()}
}

function selectPlace(d){
  const wasHidden=!popup.classList.contains('show');
  filter=d.day;selected=d;
  syncFilters();updateCopyLabel();
  const dayEl=popup.querySelector('.popup-day');
  dayEl.textContent=`${d.dayLabel}・${d.time}・第 ${d.seq} 站`;dayEl.style.color=d.color;
  popup.querySelector('.popup-name').textContent=d.name;
  popup.querySelector('.popup-kr').textContent=d.kr;
  const hoursEl=popup.querySelector('.popup-hours');
  if(d.hours){hoursEl.textContent='營業時間：'+d.hours;hoursEl.hidden=false}else{hoursEl.hidden=true}
  popup.querySelector('.popup-address-text').textContent=d.address;
  popup.querySelector('.popup-nav').href='https://map.naver.com/p/search/'+encodeURIComponent(d.address);
  const ferryEl=popup.querySelector('.popup-ferry');
  if(d.ferryUrl){ferryEl.href=d.ferryUrl;ferryEl.hidden=false}else{ferryEl.hidden=true}
  if(wasHidden){
    popup.classList.add('show');popup.setAttribute('aria-hidden','false');
    const closeBtn=popup.querySelector('.popup-close');
    if(closeBtn){void closeBtn.offsetHeight;closeBtn.focus()}
  }
  renderList();draw();
}
function syncFilters(){
  document.querySelectorAll('.filters button').forEach(btn=>{
    const id=btn.dataset.id,active=id===filter;
    btn.classList.toggle('active',active);
    if(id!=='all'){
      const day=days.find(d=>d.id===id);
      btn.style.background=active?day.color:'';
      btn.style.borderColor=active?day.color:'';
      btn.style.color=active?'#fff':'';
    }
  });
}
function renderList(){
  const closed=new Set(Array.from(list.querySelectorAll('details')).filter(el=>!el.open).map(el=>el.dataset.day));
  list.innerHTML=days.map((day,di)=>`<details class="day-group${day.id===filter?' active':''}" data-day="${day.id}" ${closed.has(day.id)?'':'open'}>
    <summary><span class="day-dot" style="background:${day.color}"></span><span class="day-title">DAY ${di+1}</span><span class="day-date">${day.label} ${day.wd}</span><span class="chevron">›</span></summary>
    <div class="day-items">${day.places.map(d=>`<button class="item ${selected&&selected.key===d.key?'selected':''}" type="button" data-key="${d.key}"><span class="item-num" style="background:${d.color}">${String(d.seq).padStart(2,'0')}</span><span><span class="item-name">${d.name}</span><span class="item-meta">${d.time}｜${d.kr}</span></span></button>`).join('')}</div>
  </details>`).join('');
  list.querySelectorAll('.item').forEach(btn=>btn.addEventListener('click',()=>{const place=all.find(d=>d.key===btn.dataset.key);closeDrawer(true);selectPlace(place)}));
}

function boundsForDay(places){
  const lons=places.map(p=>p.lon),lats=places.map(p=>p.lat);
  let minLon=Math.min(...lons),maxLon=Math.max(...lons),minLat=Math.min(...lats),maxLat=Math.max(...lats);
  const padLon=Math.max((maxLon-minLon)*.25,.02),padLat=Math.max((maxLat-minLat)*.25,.02);
  minLon-=padLon;maxLon+=padLon;minLat-=padLat;maxLat+=padLat;
  const minSpanLon=(ISLAND_BOUNDS.maxLon-ISLAND_BOUNDS.minLon)*.5,minSpanLat=(ISLAND_BOUNDS.maxLat-ISLAND_BOUNDS.minLat)*.5;
  if(maxLon-minLon<minSpanLon){const cx=(minLon+maxLon)/2;minLon=cx-minSpanLon/2;maxLon=cx+minSpanLon/2}
  if(maxLat-minLat<minSpanLat){const cy=(minLat+maxLat)/2;minLat=cy-minSpanLat/2;maxLat=cy+minSpanLat/2}
  minLon=Math.max(minLon,ISLAND_BOUNDS.minLon-.05);maxLon=Math.min(maxLon,ISLAND_BOUNDS.maxLon+.05);
  minLat=Math.max(minLat,ISLAND_BOUNDS.minLat-.05);maxLat=Math.min(maxLat,ISLAND_BOUNDS.maxLat+.05);
  return {minLon,maxLon,minLat,maxLat};
}
function niceStep(range){const steps=[.01,.02,.05,.1,.2,.5];for(const s of steps)if(range/s<=7)return s;return .5}

function layoutMarkers(show,proj,w,h,pad,gap,maxDisplace){
  gap=gap||48;maxDisplace=maxDisplace||gap*8;
  const items=show.map(place=>{const point=proj([place.lon,place.lat]);return{place:place,baseX:point[0],baseY:point[1],x:point[0],y:point[1]}}),placed=[],edge=pad+24,ringStep=Math.max(10,Math.min(gap,maxDisplace/2));
  function distanceToNearest(x,y){if(!placed.length)return Infinity;return placed.reduce((best,item)=>Math.min(best,Math.sqrt((x-item.x)*(x-item.x)+(y-item.y)*(y-item.y))),Infinity)}
  items.forEach((item,index)=>{let best={x:item.baseX,y:item.baseY,space:distanceToNearest(item.baseX,item.baseY)},chosen=null;if(best.space>=gap)chosen=best;for(let ring=1;!chosen&&ring*ringStep<=maxDisplace;ring++){const radius=ring*ringStep,steps=6*ring,rotation=(index%6)*Math.PI/18;for(let step=0;step<steps;step++){const angle=rotation+step*Math.PI*2/steps,x=item.baseX+Math.cos(angle)*radius,y=item.baseY+Math.sin(angle)*radius;if(x<edge||x>w-edge||y<edge||y>h-edge)continue;const space=distanceToNearest(x,y);if(space>best.space)best={x:x,y:y,space:space};if(space>=gap){chosen={x:x,y:y,space:space};break}}}if(!chosen)chosen=best;item.x=chosen.x;item.y=chosen.y;placed.push(item)});
  return placed;
}
function addRouteArrow(add,x1,y1,x2,y2,color,opacity){
  const mx=(x1+x2)/2,my=(y1+y2)/2,angle=Math.atan2(y2-y1,x2-x1),len=7,wid=5;
  const tipX=mx+Math.cos(angle)*len/2,tipY=my+Math.sin(angle)*len/2;
  const backX=mx-Math.cos(angle)*len/2,backY=my-Math.sin(angle)*len/2;
  const perpX=Math.cos(angle+Math.PI/2)*wid/2,perpY=Math.sin(angle+Math.PI/2)*wid/2;
  add('polygon',{class:'route-arrow',points:`${tipX.toFixed(1)},${tipY.toFixed(1)} ${(backX+perpX).toFixed(1)},${(backY+perpY).toFixed(1)} ${(backX-perpX).toFixed(1)},${(backY-perpY).toFixed(1)}`,fill:color,opacity});
}

function draw(){
  const ns='http://www.w3.org/2000/svg',mapEl=document.querySelector('.mapbox'),w=Math.max(280,mapEl.clientWidth),h=Math.max(280,mapEl.clientHeight),pad=22;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  currentViewport=document.createElementNS(ns,'g');currentViewport.setAttribute('class','viewport');
  svg.appendChild(currentViewport);
  mapW=w;mapH=h;panScale=1;panX=0;panY=0;applyTransform();

  const activeDay=filter==='all'?null:days.find(d=>d.id===filter);
  const bounds=activeDay?boundsForDay(activeDay.places):ISLAND_BOUNDS;
  const proj=([lon,lat])=>[pad+(lon-bounds.minLon)/(bounds.maxLon-bounds.minLon)*(w-pad*2),pad+(bounds.maxLat-lat)/(bounds.maxLat-bounds.minLat)*(h-pad*2)];
  const add=(tag,attrs={},label='')=>{const node=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(label)node.textContent=label;currentViewport.appendChild(node);return node};

  const lonStep=niceStep(bounds.maxLon-bounds.minLon),latStep=niceStep(bounds.maxLat-bounds.minLat);
  for(let lon=Math.ceil(bounds.minLon/lonStep)*lonStep;lon<=bounds.maxLon;lon+=lonStep){const [x]=proj([lon,bounds.minLat]);add('line',{class:'gridline',x1:x,y1:pad,x2:x,y2:h-pad})}
  for(let lat=Math.ceil(bounds.minLat/latStep)*latStep;lat<=bounds.maxLat;lat+=latStep){const [,y]=proj([bounds.minLon,lat]);add('line',{class:'gridline',x1:pad,y1:y,x2:w-pad,y2:y})}

  geo.features.forEach(feature=>{const ring=feature.geometry.coordinates[0],d=ring.map((point,i)=>{const [x,y]=proj(point);return`${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`}).join(' ')+' Z';add('path',{class:'district '+(feature.properties.code==='39010'?'jeju':'seogwipo'),d})});

  [{n:'▲ 漢拏山',p:[126.5312,33.3617],cls:'peak'},{n:'濟州市',p:[126.53,33.47]},{n:'西歸浦市',p:[126.53,33.30]},{n:'城山',p:[126.905,33.452]},{n:'涯月',p:[126.318,33.478]}].forEach(item=>{const [x,y]=proj(item.p);add('text',{class:'region-label'+(item.cls?' '+item.cls:''),x,y},item.n)});

  const isMobile=window.matchMedia('(max-width:767.98px)').matches;
  const isAllMode=filter==='all';
  const V=isMobile?{
    markerR:isAllMode?9.5:12,markerRSel:isAllMode?13:15,markerFont:10.5,
    hitR:20,ringR:isAllMode?16:18,
    routeWidthActive:isAllMode?1.8:2.5,routeOpacityActive:isAllMode?.45:.85,
    routeOpacityFade:.08,
    markerOpacityAll:.85,
    showContext:false,
    gap:22,maxDisplace:32,
    arrows:!isAllMode
  }:{
    markerR:13,markerRSel:18,markerFont:11.5,
    hitR:24,ringR:22,
    routeWidthActive:1.8,routeOpacityActive:.55,
    routeOpacityFade:.1,
    markerOpacityAll:1,
    showContext:true,
    gap:48,maxDisplace:48*8,
    arrows:false
  };

  days.forEach(day=>{
    const isActive=filter==='all'||day.id===filter;
    const pts=day.places.map(p=>proj([p.lon,p.lat]));
    if(pts.length>1){
      add('polyline',{class:'route',stroke:day.color,style:`opacity:${isActive?V.routeOpacityActive:V.routeOpacityFade};stroke-width:${isActive?V.routeWidthActive:1.4}px`,points:pts.map(p=>p.join(',')).join(' ')});
      if(isActive&&V.arrows){for(let i=0;i<pts.length-1;i++)addRouteArrow(add,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],day.color,.65)}
    }
  });

  if(activeDay&&V.showContext){
    const others=all.filter(p=>p.day!==filter).filter(p=>{const [x,y]=proj([p.lon,p.lat]);return x>=-16&&x<=w+16&&y>=-16&&y<=h+16});
    others.forEach(place=>{const [x,y]=proj([place.lon,place.lat]),g=document.createElementNS(ns,'g');g.setAttribute('class','marker context');g.setAttribute('transform',`translate(${x},${y})`);g.setAttribute('opacity','.15');const circle=document.createElementNS(ns,'circle');circle.setAttribute('r','5');circle.setAttribute('fill',place.color);g.appendChild(circle);currentViewport.appendChild(g)});
  }

  const focusPlaces=activeDay?activeDay.places:all;
  const markers=layoutMarkers(focusPlaces,proj,w,h,pad,V.gap,V.maxDisplace);
  markers.forEach(item=>{const dx=item.x-item.baseX,dy=item.y-item.baseY;if(Math.sqrt(dx*dx+dy*dy)>3)add('line',{class:'leader',x1:item.baseX,y1:item.baseY,x2:item.x,y2:item.y})});
  let selectedNode=null;
  markers.forEach(item=>{
    const place=item.place,isSel=!!(selected&&selected.key===place.key),g=document.createElementNS(ns,'g');
    g.setAttribute('class','marker '+(isSel?'selected':''));
    g.setAttribute('transform',`translate(${item.x},${item.y})`);
    g.setAttribute('role','button');g.setAttribute('tabindex','0');
    g.setAttribute('aria-label',`${place.dayLabel} ${place.seq}. ${place.name}`);
    if(isAllMode)g.setAttribute('opacity',String(V.markerOpacityAll));
    const hit=document.createElementNS(ns,'circle');hit.setAttribute('class','hit');hit.setAttribute('r',String(V.hitR));
    g.appendChild(hit);
    if(isSel){const ring=document.createElementNS(ns,'circle');ring.setAttribute('class','ring');ring.setAttribute('r',String(V.ringR));g.appendChild(ring)}
    const circle=document.createElementNS(ns,'circle');circle.setAttribute('class','dot');circle.setAttribute('r',isSel?V.markerRSel:V.markerR);circle.setAttribute('fill',place.color);
    const text=document.createElementNS(ns,'text');text.style.fontSize=V.markerFont+'px';text.textContent=place.seq;
    g.appendChild(circle);g.appendChild(text);
    g.addEventListener('click',()=>{if(mapDragMoved)return;selectPlace(place)});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPlace(place)}});
    currentViewport.appendChild(g);
    if(isSel)selectedNode=g;
  });
  if(selectedNode)currentViewport.appendChild(selectedNode);
}

document.querySelectorAll('.filters button').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.id;selected=null;syncFilters();updateCopyLabel();hidePopup(false);renderList();draw()}));
document.querySelector('.copy-all').addEventListener('click',()=>copyText(visible().map(d=>`${d.dayLabel} ${d.seq}. ${d.name}\n${d.kr}\n地址：${d.address}`).join('\n\n')));
document.querySelector('.popup-copy').addEventListener('click',()=>{if(selected)copyText(`中文名稱：${selected.name}\n韓文名稱：${selected.kr}\n地址：${selected.address}`)});
document.querySelector('.popup-address-copy').addEventListener('click',()=>{if(selected)copyText(selected.address)});
document.querySelector('.popup-close').addEventListener('click',()=>hidePopup(true));
menuToggle.addEventListener('click',openDrawer);
document.querySelector('.sidebar-close').addEventListener('click',closeDrawer);
document.querySelector('.backdrop').addEventListener('click',closeDrawer);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if(document.body.classList.contains('drawer-open'))closeDrawer();else if(selected)hidePopup(true);return}
  if(event.key==='Tab'&&document.body.classList.contains('drawer-open')){
    const focusables=sidebar.querySelectorAll('button, [href], summary, [tabindex]:not([tabindex="-1"])');
    if(!focusables.length)return;
    const first=focusables[0],last=focusables[focusables.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
  }
});
if('ResizeObserver'in window)new ResizeObserver(draw).observe(document.querySelector('.mapbox'));else window.addEventListener('resize',draw);
updateCopyLabel();renderList();draw();
</script>

</body>
